<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking Confirmation - Hotel Booking System</title>
    <link rel="stylesheet" href="http://localhost/css/style.css" />
    <link rel="stylesheet" href="http://localhost/css/responsive.css" />
</head>
<body>
    <div class="container">
        <div class="registration-container">
            <div class="logo-section">
                <img src="http://localhost/images/logo.svg" alt="Hotel Logo" class="logo" />
            </div>
            
            <div id="confirmationContent">
                <div class="loading" style="text-align: center; padding: 40px 20px; color: #7f8c8d;">
                    <h2>Loading your booking confirmation...</h2>
                    <p>Please wait while we retrieve your reservation details.</p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            // Get booking reference from URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const bookingRef = urlParams.get('ref');
            
            if (!bookingRef) {
                showError('No booking reference provided');
                return;
            }
            
            // Load booking confirmation from Node.js server
            loadConfirmation(bookingRef);
        });
        
        function loadConfirmation(bookingRef) {
            $.ajax({
                url: `http://localhost:3000/confirmation/${bookingRef}`,
                method: 'GET',
                success: function(response) {
                    // The Node.js server returns full HTML page
                    // Extract the confirmation content
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(response, 'text/html');
                    const content = doc.querySelector('.confirmation-container');
                    
                    if (content) {
                        $('#confirmationContent').html(content.innerHTML);
                    } else {
                        // If parsing fails, just replace entire content
                        $('body').html(response);
                    }
                },
                error: function(xhr) {
                    let errorMessage = 'Unable to load booking confirmation.';
                    
                    if (xhr.status === 404) {
                        errorMessage = 'Booking not found. The booking reference may be invalid or expired.';
                    } else if (xhr.status === 500) {
                        errorMessage = 'Server error. Please try again later.';
                    }
                    
                    showError(errorMessage);
                }
            });
        }
        
        function showError(message) {
            $('#confirmationContent').html(`
                <div style="text-align: center;">
                    <div style="width: 80px; height: 80px; margin: 0 auto 30px; background: #e74c3c; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 48px; color: white; font-weight: bold;">✗</div>
                    <h1 style="color: #2c3e50; font-size: 28px; margin-bottom: 10px;">Error</h1>
                    <div style="color: #e74c3c; padding: 20px; background: #fadbd8; border-radius: 5px; margin: 20px 0;">
                        ${message}
                    </div>
                    <a href="http://localhost/index.html" class="btn btn-primary">Go to Homepage</a>
                </div>
            `);
        }
    </script>
</body>
</html>
